name: Build Portable (Windows)

# ساخت نسخهٔ قابل حمل «سامانه هوشمند آموزش» برای ویندوز و انتشار
# در بخش Releases — بدون نیاز به Python / PyCharm / Node در مقصد.
#
# روش استفاده:
#   1) روی برچسب جدید push بدهید:  git tag v1.0.0 && git push origin v1.0.0
#   2) یا از تب Actions به‌صورت دستی (workflow_dispatch) اجرا کنید
#
# خروجی: SmartEducation-Portable-win64.zip

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-portable:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build frontend (React + Vite)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Copy frontend dist into backend
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force backend/frontend_dist -ErrorAction SilentlyContinue
          Copy-Item -Recurse frontend/dist backend/frontend_dist
          Get-ChildItem backend/frontend_dist | Select-Object Name

      - name: Build portable executable (PyInstaller)
        working-directory: backend
        run: |
          pyinstaller ..\portable\education_server.spec --noconfirm --clean

      - name: Smoke test the portable build
        shell: pwsh
        run: |
          $exe = "backend\dist\SmartEducation\SmartEducation.exe"
          if (-not (Test-Path $exe)) { throw "Executable not found: $exe" }
          $proc = Start-Process -FilePath $exe -PassThru
          $okHealth = $false
          $okRoot = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8084/health" -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $okHealth = $true; break }
            } catch { }
          }
          # ریشه باید رابط کاربری (index.html) را سرو کند — نه پیام JSON
          try {
            $root = Invoke-WebRequest -Uri "http://127.0.0.1:8084/" -UseBasicParsing -TimeoutSec 5
            if ($root.StatusCode -eq 200 -and $root.Content -match 'id="root"') { $okRoot = $true }
          } catch { }
          # سرویس‌دهی به سایر سامانه‌ها باید فعال باشد
          $okSvc = $false
          try {
            $svc = Invoke-WebRequest -Uri "http://127.0.0.1:8084/api/services/health" -UseBasicParsing -TimeoutSec 5
            if ($svc.StatusCode -eq 200 -and $svc.Content -match 'smart-education') { $okSvc = $true }
          } catch { }
          # حساب مدیر پیش‌فرض باید ساخته شده و ورود کار کند
          $okAuth = $false
          try {
            $body = '{"username":"admin","password":"admin123"}'
            $login = Invoke-WebRequest -Uri "http://127.0.0.1:8084/api/auth/login" -Method POST -Body $body -ContentType "application/json" -UseBasicParsing -TimeoutSec 5
            if ($login.StatusCode -eq 200 -and $login.Content -match '"role":"admin"') { $okAuth = $true }
          } catch { }
          if ($okHealth -and $okRoot -and $okSvc -and $okAuth) { Write-Host "Portable build smoke test PASSED (health + UI + services + auth)" }
          elseif ($okHealth -and -not $okAuth) { Write-Host "Warning: auth login check failed" }
          elseif ($okHealth -and -not $okSvc) { Write-Host "Warning: services API check failed" }
          elseif ($okHealth) { Write-Host "Warning: health OK but root UI check failed" }
          else { Write-Host "Warning: health check did not answer (may be port conflict)" }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $readme = @'
          ==========================================================
           سامانه هوشمند آموزش — نسخهٔ قابل حمل (Portable)
           Smart Education — Portable Edition  (v2.4.1)
          ==========================================================

          روش اجرا:
            1) فایل SmartEducation.exe را اجرا کنید.
            2) چند لحظه صبر کنید تا مرورگر به‌صورت خودکار باز شود؛
               رابط کاربری اصلی سامانه (داشبورد) نمایش داده می‌شود.
               (اگر باز نشد، آدرس http://127.0.0.1:8084 را باز کنید)
            3) برای خروج، پنجرهٔ سیاه (کنسول) را ببندید.

          آدرس رسمی سامانه روی سرور:
            - این سامانه روی همهٔ کارت‌های شبکه گوش می‌دهد (پورت 8084)؛
              آدرس رسمی: http://188.212.96.235:8084
            - دقت کنید فایروال ویندوز برای پورت 8084 مجوز ورودی داشته باشد.

          گزارش‌سازی چهارفرمتی:
            - از منوی کنار داشبورد، گزینهٔ «استودیو گزارش‌ها (۴ فرمت)» را بزنید
              یا آدرس http://127.0.0.1:8084/reports-page را باز کنید.
            - خروجی‌ها: HTML · PowerPoint (PPTX) · PDF · Word (DOCX)
            - خروجی‌های ساخته‌شده در پوشهٔ exports کنار برنامه ذخیره می‌شوند.

          یکپارچگی با سامانهٔ برنامه‌ریزی درسی:
            - لیست درس‌ها از سرویس رسمی زیر خوانده می‌شود:
              http://188.212.96.235:8083
            - آدرس سرویس از طریق فایل run.bat قابل تغییر است (SCHEDULER_BASE_URL).

          سرویس‌دهی سرفصل‌ها به سایر سامانه‌ها:
            - سامانه‌های دیگر می‌توانند سرفصل‌ها و محتوای درسی را از مسیرهای
              /api/services/... بخوانند (شرح در استودیو گزارش‌ها و /docs).
            - ارسال سرفصل‌ها به سامانهٔ دیگر: از استودیو گزارش‌ها، بخش
              «ارسال سرویس به سامانهٔ دیگر (Push)».

          حساب‌های کاربری و نقش‌ها:
            - حساب پیش‌فرض مدیر سامانه:
                نام کاربری: admin   رمز اولیه: admin123
                (بعد از اولین ورود از منوی داشبورد رمز را عوض کنید)
            - ثبت‌نام دانشجو: فعال‌سازی خودکار
            - ثبت‌نام استاد: نیازمند تایید مدیر سامانه یا مدیرگروه
            - ثبت‌نام مدیرگروه: نیازمند تایید مدیر سامانه
            - مدیریت کاربران: منوی «مدیریت کاربران» در داشبورد

          نکات مهم:
            - نیازی به نصب Python، PyCharm، Node.js یا هر پیش‌نیاز دیگری نیست.
            - دیتابیس در پوشهٔ data کنار فایل exe ذخیره می‌شود؛
              برای انتقال برنامه به رایانهٔ دیگر، کل این پوشه را کپی کنید.
            - اگر پورت 8084 اشغال باشد، برنامه به‌صورت خودکار پورت بعدی را
              استفاده می‌کند (آدرس را در پنجرهٔ کنسول ببینید).
            - تولید PDF و آیکون‌ها کاملاً آفلاین است (فونت وزیرمتن باندل شده).

          رفع اشکال:
            - اگر صفحه باز نشد: چند ثانیه صبر کنید و صفحه را رفرش کنید.
            - اگر آنتی‌ویروس هشدار داد: فایل ANTIVIRUS-NOTE.txt را بخوانید؛
              این هشدار «مثبت کاذب» است و راه‌حل کامل آن در همان فایل آمده است.
          '@
          Set-Content -Path "backend\dist\SmartEducation\README-PORTABLE.txt" -Value $readme -Encoding UTF8

          $bat = @'
          @echo off
          chcp 65001 >nul
          rem آدرس سرویس برنامه‌ریزی درسی (پیش‌فرض رسمی):
          rem set SCHEDULER_BASE_URL=http://188.212.96.235:8083
          start "" "%~dp0SmartEducation.exe"
          '@
          Set-Content -Path "backend\dist\SmartEducation\run.bat" -Value $bat -Encoding UTF8

          $avnote = @'
          ==========================================================
           راهنمای هشدار آنتی‌ویروس (مثبت کاذب) — ANTIVIRUS NOTE
           Smart Education — نسخهٔ قابل حمل
          ==========================================================

          ● اگر آنتی‌ویروس (Defender / Avast / Kaspersky / ...) هنگام اجرای
            SmartEducation.exe هشدار داد، این یک «مثبت کاذب» (False Positive)
            است: برنامه هیچ کد مخربی ندارد و کل سورس‌کد آن به‌صورت عمومی در
            گیت‌هاب قابل بازبینی است:
            https://github.com/hjalilvand2004-coder/smart-education

          ● چرا این هشدار ظاهر می‌شود؟
            این برنامه با ابزار معروف و سالم PyInstaller بسته‌بندی شده است.
            فایل‌های ساخته‌شده با PyInstaller که «امضای دیجیتال خریداری‌شده»
            ندارند، توسط برخی آنتی‌ویروس‌ها به‌اشتباه مشکوک شناخته می‌شوند.
            این موضوع هزاران برنامهٔ سالم و معروف را هم درگیر می‌کند.

          ● راه‌حل در ویندوز (Defender) — افزودن پوشهٔ برنامه به فهرست امن:
            1) منوی Start را باز کنید و بنویسید: Windows Security
            2) وارد Virus & threat protection شوید
            3) زیر Virus & threat protection settings روی «Manage settings» بزنید
            4) پایین صفحه: Exclusions → «Add or remove exclusions»
            5) «Add an exclusion» → «Folder» → پوشهٔ SmartEducation را انتخاب کنید
            6) اگر فایل قبلاً قرنطینه شده، از Protection history آن را Restore کنید

            یا در PowerShell (با دسترسی مدیر) فقط یک خط:
            Add-MpPreference -ExclusionPath "C:\مسیر-پوشه\SmartEducation"

          ● آنتی‌ویروس‌های دیگر (Avast / AVG / Kaspersky / Bitdefender / ESET):
            در تنظیمات آن‌ها گزینهٔ Exclusions / Whitelist / Trusted Zone را
            پیدا کنید و همین پوشه را اضافه کنید.

          ● برای اطمینان از سلامت فایل، اثر انگشت SHA256 آن را با فایل
            SHA256SUMS.txt کنار فایل زیپ (در صفحهٔ Releases) مقایسه کنید:
            https://github.com/hjalilvand2004-coder/smart-education/releases

          ● کمک به رفع دائمی: می‌توانید فایل را به‌عنوان «مثبت کاذب» به سازندهٔ
            آنتی‌ویروس خود گزارش دهید تا در پایگاه‌دادهٔ آن اصلاح شود؛ نمونه:
            https://www.microsoft.com/en-us/wdsi/filesubmission
          '@
          Set-Content -Path "backend\dist\SmartEducation\ANTIVIRUS-NOTE.txt" -Value $avnote -Encoding UTF8

          Compress-Archive -Path "backend\dist\SmartEducation" -DestinationPath "backend\dist\SmartEducation-Portable-win64.zip" -Force

          # اثر انگشت SHA256 برای تایید سلامت فایل‌ها (پاسخ به هشدار آنتی‌ویروس)
          $zipHash = (Get-FileHash "backend\dist\SmartEducation-Portable-win64.zip" -Algorithm SHA256).Hash.ToLower()
          $exeHash = (Get-FileHash "backend\dist\SmartEducation\SmartEducation.exe" -Algorithm SHA256).Hash.ToLower()
          $sums = @"
          SHA256  SmartEducation-Portable-win64.zip  =  $zipHash
          SHA256  SmartEducation.exe (inside zip)    =  $exeHash
          Verify at: https://github.com/hjalilvand2004-coder/smart-education/releases
          "@
          Set-Content -Path "backend\dist\SHA256SUMS.txt" -Value $sums -Encoding ASCII
          Write-Host "SHA256(zip) = $zipHash"
          Write-Host "SHA256(exe) = $exeHash"

          # متن صفحهٔ Release (با جای‌گذاری هش‌ها)
          $body = @'
          ## نسخهٔ قابل حمل سامانه هوشمند آموزش 🎓 — v2.4.1

          ### 🛡️ جدید در این نسخه: رفع هشدارهای کاذب آنتی‌ویروس
          اگر آنتی‌ویروس روی نسخه‌های قبلی هشدار «ویروس» می‌داد، این هشدار
          «مثبت کاذب» بود. در این نسخه:
          - به فایل اجرایی **اطلاعات رسمی نسخه/سازنده (VERSIONINFO)** و
            **آیکون رسمی برنامه** اضافه شد تا آنتی‌ویروس آن را ناشناس تشخیص ندهد
          - فایل **ANTIVIRUS-NOTE.txt** داخل بسته اضافه شد: راهنمای گام‌به‌گام
            افزودن برنامه به فهرست امن (Exclusions) ویندوز و آنتی‌ویروس‌های دیگر
          - فایل **SHA256SUMS.txt** برای بررسی سلامت فایل دانلودی منتشر می‌شود
          - برنامه فاقد هرگونه کد مخرب است؛ سورس کامل در گیت‌هاب باز است:
            https://github.com/hjalilvand2004-coder/smart-education

          ### ✅ اثر انگشت SHA256 (سلامت فایل)
          - SmartEducation-Portable-win64.zip : __ZIPHASH__
          - SmartEducation.exe : __EXEHASH__

          ### 🔐 امکانات قبلی (v2.4.0)
          - **صفحهٔ ورود** — سامانه با نام کاربری و رمز عبور باز می‌شود
          - **ثبت‌نام در ۳ نقش**: دانشجو (فعال‌سازی خودکار)، استاد و مدیرگروه (نیازمند تایید)
          - **گردش کار تایید**: تایید استاد توسط مدیر سامانه یا مدیرگروه؛
            تایید مدیرگروه فقط توسط مدیر سامانه
          - **مدیریت کاربران**: تایید/رد، فعال/غیرفعال، تغییر نقش، بازنشانی رمز و حذف
          - حساب پیش‌فرض مدیر: `admin / admin123` (پس از اولین ورود رمز را عوض کنید)

          ### 🌐 آدرس‌های رسمی سرویس‌ها
          - **این سامانه (آموزش):** http://188.212.96.235:8084
          - **سرویس برنامه‌ریزی درسی (لیست درس‌ها):** http://188.212.96.235:8083

          ### ✨ امکانات دیگر
          - 📊 استودیو گزارش‌ها در ۴ فرمت: HTML · PowerPoint · PDF · Word
          - 🔗 سرویس‌دهی سرفصل‌ها و محتوای درسی به سایر سامانه‌ها (/api/services/...)
          - ⇪ ارسال سرفصل‌ها به سامانهٔ دیگر (Push) از استودیو گزارش‌ها

          ### 📦 نصب و اجرا (بدون هیچ پیش‌نیازی!)
          1. فایل زیپ را دانلود و استخراج کنید
          2. SmartEducation.exe را اجرا کنید
          3. مرورگر به‌صورت خودکار باز می‌شود؛ با حساب مدیر وارد شوید

          ### ✅ بدون نیاز به Python | بدون نیاز به PyCharm | بدون نیاز به Node.js

          💾 دیتابیس و کاربران در پوشهٔ data کنار برنامه ذخیره می‌شود
          ⚠️ برای دسترسی از IP، پورت 8084 در فایروال ویندوز باید باز باشد
          '@
          $body = $body.Replace('__ZIPHASH__', $zipHash).Replace('__EXEHASH__', $exeHash)
          $bodyPath = "backend\dist\release-body.md"
          Set-Content -Path $bodyPath -Value $body -Encoding UTF8
          Get-Item "backend\dist\SmartEducation-Portable-win64.zip" | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartEducation-Portable-win64
          path: |
            backend/dist/SmartEducation-Portable-win64.zip
            backend/dist/SHA256SUMS.txt
          retention-days: 14

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend/dist/SmartEducation-Portable-win64.zip
            backend/dist/SHA256SUMS.txt
          generate_release_notes: true
          body_path: backend/dist/release-body.md
