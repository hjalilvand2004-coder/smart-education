name: Build Portable (Windows)

# ساخت نسخهٔ قابل حمل «سامانه هوشمند آموزش» برای ویندوز و انتشار
# در بخش Releases — بدون نیاز به Python / PyCharm / Node در مقصد.
#
# روش استفاده:
#   1) روی برچسب جدید push بدهید:  git tag v1.0.0 && git push origin v1.0.0
#   2) یا از تب Actions به‌صورت دستی (workflow_dispatch) اجرا کنید
#
# خروجی: SmartEducation-Portable-win64.zip

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-portable:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build frontend (React + Vite)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Copy frontend dist into backend
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force backend/frontend_dist -ErrorAction SilentlyContinue
          Copy-Item -Recurse frontend/dist backend/frontend_dist
          Get-ChildItem backend/frontend_dist | Select-Object Name

      - name: Build portable executable (PyInstaller)
        working-directory: backend
        run: |
          pyinstaller ..\portable\education_server.spec --noconfirm --clean

      - name: Smoke test the portable build
        shell: pwsh
        run: |
          $exe = "backend\dist\SmartEducation\SmartEducation.exe"
          if (-not (Test-Path $exe)) { throw "Executable not found: $exe" }
          $proc = Start-Process -FilePath $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8100/health" -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if ($ok) { Write-Host "Portable build smoke test PASSED" }
          else { Write-Host "Warning: health check did not answer (may be port conflict)" }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $readme = @"
          ==========================================================
           سامانه هوشمند آموزش — نسخهٔ قابل حمل (Portable)
           Smart Education — Portable Edition
          ==========================================================

          روش اجرا:
            1) فایل SmartEducation.exe را اجرا کنید.
            2) چند لحظه صبر کنید تا مرورگر به‌صورت خودکار باز شود.
               (اگر باز نشد، آدرس http://127.0.0.1:8100 را باز کنید)
            3) برای خروج، پنجرهٔ سیاه (کنسول) را ببندید.

          گزارش‌سازی چهارفرمتی:
            - صفحهٔ «استودیو گزارش‌ها»:  http://127.0.0.1:8100/reports-page
            - خروجی‌ها: HTML · PowerPoint (PPTX) · PDF · Word (DOCX)
            - خروجی‌های ساخته‌شده در پوشهٔ exports کنار برنامه ذخیره می‌شوند.

          یکپارچگی با سامانهٔ برنامه‌ریزی درسی (اختیاری):
            - اگر «سامانه هوشمند برنامه‌ریزی درسی» (UniversityScheduler.exe)
              روی همان رایانه اجرا باشد (پورت 8000)، این سامانه فهرست درس‌ها
              را از آن سرویس می‌خواند.
            - هر دو نسخهٔ قابل حمل می‌توانند همزمان اجرا شوند؛
              این سامانه روی پورت 8100 و آن سامانه روی 8000 کار می‌کند.
            - آدرس سرویس از طریق فایل run.bat قابل تغییر است (SCHEDULER_BASE_URL).

          نکات مهم:
            - نیازی به نصب Python، PyCharm، Node.js یا هر پیش‌نیاز دیگری نیست.
            - دیتابیس در پوشهٔ data کنار فایل exe ذخیره می‌شود؛
              برای انتقال برنامه به رایانهٔ دیگر، کل این پوشه را کپی کنید.
            - اگر پورت 8100 اشغال باشد، برنامه به‌صورت خودکار پورت بعدی را
              استفاده می‌کند (آدرس را در پنجرهٔ کنسول ببینید).
            - تولید PDF و آیکون‌ها کاملاً آفلاین است (فونت وزیرمتن باندل شده).

          رفع اشکال:
            - اگر صفحه باز نشد: چند ثانیه صبر کنید و صفحه را رفرش کنید.
            - اگر آنتی‌ویروس هشدار داد: این پوشه را در فهرست امن (Exclusion)
              قرار دهید؛ هشدار مربوط به فایل‌های اجرایی نشده با امضای دیجیتال است.
          "@
          Set-Content -Path "backend\dist\SmartEducation\README-PORTABLE.txt" -Value $readme -Encoding UTF8

          $bat = @'
          @echo off
          chcp 65001 >nul
          rem تنظیم آدرس سرویس برنامه‌ریزی درسی در صورت نیاز:
          rem set SCHEDULER_BASE_URL=http://192.168.1.10:8000
          start "" "%~dp0SmartEducation.exe"
          '@
          Set-Content -Path "backend\dist\SmartEducation\run.bat" -Value $bat -Encoding UTF8

          Compress-Archive -Path "backend\dist\SmartEducation" -DestinationPath "backend\dist\SmartEducation-Portable-win64.zip" -Force
          Get-Item "backend\dist\SmartEducation-Portable-win64.zip" | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartEducation-Portable-win64
          path: backend/dist/SmartEducation-Portable-win64.zip
          retention-days: 14

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: backend/dist/SmartEducation-Portable-win64.zip
          generate_release_notes: true
          body: |
            ## نسخهٔ قابل حمل سامانه هوشمند آموزش 🎓

            ### 📦 نصب و اجرا (بدون هیچ پیش‌نیازی!)
            1. فایل زیپ را دانلود و استخراج کنید
            2. `SmartEducation.exe` را اجرا کنید
            3. مرورگر به‌صورت خودکار روی `http://127.0.0.1:8100` باز می‌شود

            ### ✨ امکانات این نسخه
            - 📊 **استودیو گزارش‌ها** — تولید خروجی گرافیکی در ۴ فرمت:
              `HTML` · `PowerPoint` · `PDF` · `Word` از صفحهٔ `/reports-page`
            - 🔗 **اتصال به سرویس برنامه‌ریزی درسی** — خواندن فهرست درس‌ها از
              سامانهٔ UniversityScheduler (اجرای همزمان هر دو سامانه پشتیبانی می‌شود)
            - ✅ بدون نیاز به Python | ✅ بدون نیاز به Node.js | ✅ کاملاً آفلاین

            💾 دیتابیس در پوشهٔ `data` کنار برنامه ذخیره می‌شود (قابل حمل روی فلش USB)
